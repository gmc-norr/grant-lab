[project]
name = "call-manager"
version = "0.1.0"
description = "Internal hospital funding-call manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "authlib>=1.3",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "pgvector>=0.3.0",
    "pymupdf>=1.25.0",
    "trafilatura>=2.0.0",
    "anthropic>=0.102.0",
    "claude-agent-sdk",
    "markdown>=3.10.2",
    "bleach>=6.3.0",
    "pillow>=12.2.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "striprtf>=0.0.26",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "reportlab>=4.0",
    "pytest-httpx>=0.36.2",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_manager"]

[tool.uv]
# Cooldown: only consider artifacts published before this instant. Bump
# deliberately on intentional dependency updates (supply-chain spec §3.2).
# uv.lock's [options] exclude-newer mirrors this value and is regenerated by
# `uv lock` — bump it here, not by hand-editing the lock.
exclude-newer = "2026-06-14T00:00:00Z"
# Wheels-preferred: refuse to build source distributions so no third-party
# sdist build backend runs arbitrary code at install/resolve time (supply-chain
# spec §3.2, Surface A). uv's global `no-build = true` would also block the
# editable install of our own first-party project (it has no wheel) and uv
# offers no allow-list to exempt the project root, while the app + CLIs import
# `call_manager` via `uv run`, so the project MUST install editable. We instead
# scope wheels-only to every third-party dependency via `no-build-package`
# (uv's per-package form of `no-build`). Every dep in uv.lock resolves to a
# wheel today (verified), so this never runs a third-party build backend, while
# our own `call_manager` still installs editable for the app + CLIs.
#
# This list is GENERATED from uv.lock — do not hand-edit. Regenerate after any
# uv.lock change (CI enforces it stays in sync; see scripts/gen_no_build.py):
#     uv run python scripts/gen_no_build.py
# If a future dependency is legitimately source-only (no wheel), the script
# flags it: document why in the PR and exclude it (the allowlist exception).
no-build-package = [
    "alembic",
    "annotated-doc",
    "annotated-types",
    "anthropic",
    "anyio",
    "apscheduler",
    "argon2-cffi",
    "argon2-cffi-bindings",
    "attrs",
    "authlib",
    "babel",
    "bleach",
    "boolean-py",
    "cachecontrol",
    "certifi",
    "cffi",
    "charset-normalizer",
    "claude-agent-sdk",
    "click",
    "colorama",
    "courlan",
    "cryptography",
    "cyclonedx-python-lib",
    "dateparser",
    "defusedxml",
    "distro",
    "docker",
    "docstring-parser",
    "et-xmlfile",
    "fastapi",
    "filelock",
    "greenlet",
    "h11",
    "htmldate",
    "httpcore",
    "httptools",
    "httpx",
    "httpx-sse",
    "idna",
    "iniconfig",
