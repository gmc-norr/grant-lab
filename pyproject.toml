[project]
name = "grant-lab"
version = "0.1.0"
description = "Internal hospital funding-call manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "pgvector>=0.3.0",
    "lxml>=6.0",
    "anthropic>=0.102.0",
    "joserfc>=1.7.6",
    "segno>=1.6.6",
    "httpcore>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    "httpx2>=2.9.1",
    # used by tests/test_ranking_response_schema.py; came only via mcp before 2026-11-04
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "types-lxml>=2026.2.16",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grant_lab"]
# The SPA bundle (src/grant_lab/web/spa/) is emitted by the secretless
# container build (frontend/Dockerfile) and is gitignored; hatchling excludes
# VCS-ignored files by default, so this `artifacts` glob is REQUIRED to package
# it into the wheel. CI asserts the built wheel contains spa/index.html.
artifacts = ["src/grant_lab/web/spa/**/*"]

[tool.uv]
# Cooldown: only consider artifacts published before this instant. Bump
# deliberately on intentional dependency updates (supply-chain spec §3.2).
# uv.lock's [options] exclude-newer mirrors this value and is regenerated by
# `uv lock` — bump it here, not by hand-editing the lock.
#
# 2026-08-10: bumped from 2026-06-14 to clear the pip-audit CI gate, which had
# gone red on 31 advisories across 8 packages — every remaining fix version was
# published after the old instant, so the resolver could not see any of them.
# Set to 7 days before the bump date, NOT to "now": that mirrors the npm side's
# cooldown (pnpm-workspace.yaml `minimumReleaseAge: 10080` minutes = 7 days), so
# a freshly-published (or freshly-compromised) artifact still has to age before
# this project will resolve it. Keep that week when bumping again.
#
# 2026-10-06: bumped to 2026-09-29 (again 7 days back) for the same reason — the
# CI test job had never run (bad osv-scanner-action path, review 2026-10-06 H1),
# and pip-audit stood at 25 advisories in anyio/urllib3/httpx2/httpcore2/pyjwt.
# Only those five packages were upgraded (`uv lock --upgrade-package …`).
#
# 2026-10-26: bumped to 2026-10-19 (again 7 days back, from
# `date -u -d '7 days ago' +%Y-%m-%dT00:00:00Z`) — pip-audit stood at 44
# advisories in 5 packages. But only TWO of the four audit failures were ever
# cooldown-blocked: pillow 13.0.0 (uploaded 2026-10-16) and filelock 4.2.1
# (2026-10-17) are the only fix versions published after the old 2026-09-29
# instant. The other two were freely resolvable the whole time and merely sat
# un-upgraded — mcp 1.30.0 was uploaded 2026-09-07 and claude-agent-sdk 0.2.121
# on 2026-07-17 (both re-measured from PyPI's JSON API on 2026-10-26), i.e. 22
# and 74 days inside the old cooldown respectively. So the cooldown was not the
# whole story: pip-audit only runs in CI, which had never run at all until
# 2026-10-06 (H1 above) and fires only on a push to main/master or a pull
# request — there is no scheduled run — so an available fix can sit unapplied
# for months. Moving exclude-newer fixes half of this; looking more often is
# the other half.
#
# Pillow is the one that matters: it is a direct runtime dependency and decodes
# user-uploaded images. Those four packages were upgraded by name
# (`uv lock --upgrade-package …`), as were certifi (to 2026.10.18) and mako
# 1.4.3 — mako surfaced only once the OSV step could actually report
# (PYSEC-2026-4243), and its fix 1.4.2 was published 2026-09-22, likewise
# inside the old cooldown. certifi's fix is still inside the week, so it carries
# a dated --ignore-vuln in CI instead (see ci.yml).
#
# 2026-10-31: bumped to 2026-10-24 (again 7 days back). Two reasons, both upgraded
# by name: joserfc 1.7.4 -> 1.7.7 (CVE-2026-119283, CVE-2026-119284; the fix 1.7.6 was
# uploaded 2026-10-18T23:12Z, so it was already inside the old instant — the
# bump is for the second reason), and certifi -> its PYSEC-2026-4320 fix, which
# the waiver in osv-scanner.toml scheduled for "on or after 2026-10-28" (now on
# 2026.10.23). Both waivers (that block and ci.yml's --ignore-vuln) are removed
# in the same commit.
exclude-newer = "2026-10-24T00:00:00Z"
# Wheels-preferred: refuse to build source distributions so no third-party
# sdist build backend runs arbitrary code at install/resolve time (supply-chain
# spec §3.2, Surface A). uv's global `no-build = true` would also block the
# editable install of our own first-party project (it has no wheel) and uv
# offers no allow-list to exempt the project root, while the app + CLIs import
# `grant_lab` via `uv run`, so the project MUST install editable. We instead
# scope wheels-only to every third-party dependency via `no-build-package`
# (uv's per-package form of `no-build`). Every dep in uv.lock resolves to a
# wheel today (verified), so this never runs a third-party build backend, while
# our own `grant_lab` still installs editable for the app + CLIs.
#
# This list is GENERATED from uv.lock — do not hand-edit. Regenerate after any
# uv.lock change (CI enforces it stays in sync; see scripts/gen_no_build.py):
#     uv run python scripts/gen_no_build.py
# If a future dependency is legitimately source-only (no wheel), the script
# flags it: document why in the PR and exclude it (the allowlist exception).
no-build-package = [
    "alembic",
    "annotated-doc",
    "annotated-types",
    "anthropic",
    "anyio",
    "apscheduler",
    "argon2-cffi",
    "argon2-cffi-bindings",
    "ast-serialize",
    "attrs",
    "beautifulsoup4",
    "boolean-py",
    "cachecontrol",
    "certifi",
    "cffi",
    "charset-normalizer",
    "click",
    "colorama",
    "coverage",
    "cryptography",
    "cssselect",
    "cyclonedx-python-lib",
    "defusedxml",
    "distro",
    "docker",
    "docstring-parser",
    "execnet",
    "fastapi",
    "filelock",
    "greenlet",
    "h11",
    "httpcore",
    "httpcore2",
    "httptools",
    "httpx",
    "httpx2",
    "httpx2-jsfetch",
    "idna",
    "iniconfig",
    "itsdangerous",
    "jinja2",
    "jiter",
    "joserfc",
    "jsonschema",
    "jsonschema-specifications",
    "librt",
    "license-expression",
    "lxml",
    "mako",
    "markdown-it-py",
    "markupsafe",
    "mdurl",
    "msgpack",
    "mypy",
    "mypy-extensions",
    "numpy",
    "packageurl-python",
    "packaging",
    "pathspec",
    "pgvector",
    "pip",
    "pip-api",
    "pip-audit",
    "pip-requirements-parser",
    "platformdirs",
    "pluggy",
    "psycopg",
    "psycopg-binary",
    "py-serializable",
    "pycparser",
    "pydantic",
    "pydantic-core",
    "pydantic-settings",
    "pygments",
    "pyparsing",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "python-dotenv",
    "python-multipart",
    "pywin32",
    "pyyaml",
    "referencing",
    "requests",
    "rich",
    "rpds-py",
