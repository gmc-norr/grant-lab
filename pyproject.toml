    "jinja2",
    "jiter",
    "joserfc",
    "jsonschema",
    "jsonschema-specifications",
    "justext",
    "license-expression",
    "lxml",
    "lxml-html-clean",
    "mako",
    "markdown",
    "markdown-it-py",
    "markupsafe",
    "mcp",
    "mdurl",
    "msgpack",
    "numpy",
    "openpyxl",
    "packageurl-python",
    "packaging",
    "pdfminer-six",
    "pgvector",
    "pillow",
    "pip",
    "pip-api",
