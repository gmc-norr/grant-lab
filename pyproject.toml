[project]
name = "call-manager"
version = "0.1.0"
description = "Internal hospital funding-call monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "pgvector>=0.3.0",
    "pymupdf>=1.25.0",
    "trafilatura>=2.0.0",
    "anthropic>=0.102.0",
    "claude-agent-sdk",
    "markdown>=3.10.2",
    "bleach>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_manager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Treat leaked-DBAPI-connection ResourceWarnings as test failures so the
# connection-lifecycle discipline in tests/conftest.py doesn't regress
# silently. Scoped narrowly to ResourceWarning — we don't want a stray
# DeprecationWarning from an unrelated library to fail the suite.
filterwarnings = ["error::ResourceWarning"]
