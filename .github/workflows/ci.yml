name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are SHA-pinned (full commit) so a repointed tag can't
      # inject code into a repo-write build; the trailing comment keeps the human
      # version, and the github-actions Dependabot ecosystem (see dependabot.yml)
      # bumps both the SHA and the comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          # Match the uv that maintains uv.lock locally (was 0.4.x), so
          # `uv lock --check` semantics agree with what produced the lock.
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      - name: Verify lockfile up-to-date (incl. exclude-newer)
        # Fails if pyproject and uv.lock diverge — e.g. someone widened
        # [tool.uv] exclude-newer in pyproject without re-locking. gen_no_build
        # --check only validates the wheels-only list, not lock freshness.
        run: uv lock --check

      - name: Verify wheels-only allowlist in sync with uv.lock
        run: uv run python scripts/gen_no_build.py --check

      - name: Verify route artifacts in sync with routes.json
        run: uv run python scripts/gen_routes.py --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -v

      - name: pip-audit (Python deps)
        # pip-audit is now a locked dev dependency (synced above), so we run it
        # from the synced env rather than an unpinned `--with` resolve.
        run: uv run pip-audit

      - name: OSV-Scanner (uv.lock)
        # google/osv-scanner-action ships no moving major tag; pin the latest v1.x release.
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: "--lockfile=uv.lock"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version (matches frontend/.nvmrc
          # and the node:22 build container) — bump in one place.
          node-version-file: frontend/.nvmrc

      # --- Frontend SPA (Plan 2): pnpm frozen + scripts-off, scanners, container build ---
      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Frontend deps (frozen, scripts off)
        run: cd frontend && pnpm install --frozen-lockfile

      # Review 2026-09-02 A7 F5: there was NO frontend lint gate at all — no
      # eslint/oxlint/biome config anywhere, so five `eslint-disable` directives
      # in src/ suppressed rules that had never run. oxlint is zero-config and
      # one dev dep. `--deny-warnings` makes it a gate, not a report.
      - name: Frontend lint (oxlint)
        run: cd frontend && pnpm run lint

      - name: Frontend unit tests (vitest)
        run: cd frontend && pnpm run test

      # Gate 1 of the Call Match edition split: the match bundle must contain no
      # proposal-assist module. Gates 2, 4 and 5 are vitest/pytest and already
      # run above; gate 1 is a build script, so without this step it fired only
      # when a human remembered — which is not a gate.
      #
      # It asserts on dist/module-manifest.json, the module graph Rollup actually
      # built, by file path. Chunk-filename matching and string sentinels were
      # both tried against this repo and both failed; scripts/check_match_bundle.mjs
      # records the measurements. The two commands are chained with && on purpose:
      # a build that fails at tsc writes no manifest, and a separately-invoked
      # check would then read the previous clean one and exit 0.
      - name: Match-edition bundle gate (no cockpit module)
        run: cd frontend && pnpm run build:match && pnpm run check:bundle

      # A SECOND vitest invocation, and it needs to be second. The build-time
      # alias (virtual:app-router -> router.tsx | router.simple.tsx) has exactly
      # one test, src/virtual-router.test.ts, and a vitest run can only ever
      # exercise ONE direction of it: the alias is resolved once, at vite config
      # time, from VITE_APP_EDITION. The run above has it unset, so it asserts
      # the full direction — and the match direction, the one this branch exists
      # to protect, was asserted nowhere. There is no way to cover both in one
      # process, hence the extra ~10 s.
      - name: Match-edition router alias (the direction the main run cannot cover)
        run: cd frontend && VITE_APP_EDITION=match pnpm run test src/virtual-router.test.ts

      # OpenAPI -> TS drift: regenerate the committed client types from the live
      # route definitions (DB-free; no server needed) and fail if they changed.
      # Keeps frontend/src/api/schema.gen.ts in lockstep with the FastAPI schema.
      - name: OpenAPI types in sync (drift check)
        run: |
          bash scripts/gen_openapi_types.sh
          git diff --exit-code frontend/src/api/schema.gen.ts

      # Block on PRODUCTION (runtime/browser) deps — these are what ship in the
      # SPA bundle. react/react-dom are currently clean.
      - name: pnpm audit (production deps — blocking)
        run: cd frontend && pnpm audit --prod --audit-level=high
      # Dev/build-tooling advisories (vite/esbuild/vitest dev-server, etc.) do
      # NOT reach production (FastAPI serves only static files — no node, vite,
      # or vitest at runtime) and are mitigated by the ephemeral secretless build
      # + never exposing dev servers (no `vitest --ui`). Surface them
      # (non-blocking); Dependabot (npm) drives the toolchain bumps.
      - name: pnpm audit (all deps — informational)
        run: cd frontend && pnpm audit || true

      - name: OSV-Scanner (pnpm-lock.yaml)
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: "--lockfile=frontend/pnpm-lock.yaml"

      # Build the SPA in the ephemeral, non-root, secretless container — then
      # extract ONLY the static bundle and package it into the wheel. The wheel
      # MUST contain spa/index.html (a missing-build wheel fails here, not at
      # runtime). NOTE: Socket CLI (spec §5) is a token-gated follow-up — it
      # needs SOCKET_SECURITY_API_KEY; pnpm audit + OSV over the lockfile +
      # Dependabot (npm) provide the tokenless JS supply-chain baseline.
      - name: Build SPA in the ephemeral secretless container
        run: docker build -f frontend/Dockerfile -t grant-lab-spa-build .

      # Extract to frontend/dist and then let scripts/package_spa.sh write the
      # served tree. It used to `docker cp` straight into src/grant_lab/web/spa,
      # which bypassed the bundle gate AND left no edition.txt — so the wheel's SPA
      # was un-gated and unlabelled, and web/spa_serving.py's boot-time mismatch
      # check could never fire on it (absent marker = unknown = allowed). Routing
      # through the script makes the wheel's SPA carry the same proof as a local
      # `pnpm package:match`: the gate reads dist/module-manifest.json, the marker
      # records what it proved. package_spa.sh is now the ONLY writer of that
      # directory, which tests/architecture/test_package_spa.py pins.
      - name: Extract the SPA bundle and package it through the gate
        run: |
          c=$(docker create grant-lab-spa-build)
          rm -rf frontend/dist && mkdir -p frontend/dist
          docker cp "$c:/build/dist/." frontend/dist/
          docker rm "$c"
          bash scripts/package_spa.sh

      - name: Build the wheel and assert it contains the SPA
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -q "grant_lab/web/spa/index.html"

  # Playwright e2e — the two specs the seed harness can drive end to end
  # (review 2026-09-02 §7 item 11; wired 2026-09-03). Both front doors are gated:
  # `dev` is the Vite proxy the harness defaults to, `prod` builds the SPA and
  # serves it from uvicorn under the strict CSP — the 3b-5d.D4 flip gate. Its own
  # job so a browser-level failure is reported on its own and the unit gates
  # keep running. It was deliberately left unwired until the selection-toolbar
  # overlap (collab.spec.ts "owner cites after both users edit", gap 30 > 24)
  # was fixed — wiring it earlier would have turned CI red on a known bug.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        spa_mode: [dev, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Frontend deps (frozen, scripts off)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Playwright Chromium (+ OS libs)
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      # The harness boots a testcontainers Postgres (Docker is on the runner),
      # migrates, seeds two users + a workspace + a password user + a call, starts
      # uvicorn (and Vite in dev mode), runs the specs, and tears it all down.
      - name: Playwright e2e (collab two-browser + dashboard) — SPA_MODE=${{ matrix.spa_mode }}
        env:
          E2E_SPA_MODE: ${{ matrix.spa_mode }}
          E2E_SPECS: e2e/collab.spec.ts e2e/dashboard.spec.ts
        run: bash scripts/collab_e2e_run.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.spa_mode }}
          path: |
            frontend/test-results/
            .e2e-vite.log
          if-no-files-found: ignore

  # The MATCH edition's only browser coverage. Its own job, and deliberately not
  # a third value in the `e2e` matrix above: that matrix drives
  # scripts/collab_e2e_run.sh, which needs uv, a testcontainers Postgres and a
  # seeded workspace. This needs none of them — playwright.config.ts's match mode
  # builds the bundle, runs gate 1 over it, serves frontend/dist statically and
  # mocks /api in-page. ~2 min, no Docker, no Python.
  #
  # Why it exists: every other gate on this branch is a unit test or a static
  # scan, and release 1 still shipped with no way to sign out and a call list
  # whose rows navigated nowhere. Both were obvious in a browser in seconds.
  # Pointing this spec at a FULL build fails all 8 of its tests, so a green run
  # is evidence about the match artefact specifically.
  match-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Frontend deps (frozen, scripts off)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Playwright Chromium (+ OS libs)
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      # `pnpm run e2e:match` is E2E_MODE=match; the webServer block chains
      # build:match && check:bundle && serve, so a build that fails at tsc cannot
      # leave the previous dist/ standing for the browser to pass over.
      - name: Match-edition browser smoke
        run: cd frontend && pnpm run e2e:match

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-match
          path: frontend/test-results/
          if-no-files-found: ignore
