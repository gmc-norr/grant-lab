name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      - name: Verify wheels-only allowlist in sync with uv.lock
        run: uv run python scripts/gen_no_build.py --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -v

      - name: pip-audit (Python deps)
        run: uv run --with pip-audit pip-audit

      - name: OSV-Scanner (uv.lock)
        uses: google/osv-scanner-action@v1
        with:
          scan-args: "--lockfile=uv.lock"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS unit tests
        run: node --test tests/js/
