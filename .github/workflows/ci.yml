name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A superseded push used to keep running to completion alongside its replacement
# (review 2026-10-26 A1: no workflow set `concurrency:`). One run per ref, and the
# older one is cancelled the moment a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# WHY SEPARATE JOBS AND NOT ONE (review 2026-10-26 M-ops-1): `test` was a single
# sequential chain, and GitHub skips every later step in a job once one fails. Run
# 37483120721 skipped SIXTEEN steps because pytest failed (7 environment failures),
# so pip-audit and every frontend and packaging gate after it never ran. The audit
# sat right after pytest, so one overnight CVE advisory would have done the same: a
# vitest regression would stay invisible until the advisory was waived. The
# jobs below have no `needs:` between them on purpose: they run in parallel and
# each reports its own verdict, so a red audit can no longer skip a green bundle
# gate. Setup steps (checkout / uv / node / corepack / pnpm install) are therefore
# duplicated into each job that needs them — that duplication is the price of the
# independence, and it is paid in parallel.
jobs:
  # ruff, the lock/no-build/route artefact checks, pytest, and the coverage floors check.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Third-party actions are SHA-pinned (full commit) so a repointed tag can't
      # inject code into a repo-write build; the trailing comment keeps the human
      # version, and the github-actions Dependabot ecosystem (see dependabot.yml)
      # bumps both the SHA and the comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          # Match the uv that maintains uv.lock locally (was 0.4.x), so
          # `uv lock --check` semantics agree with what produced the lock.
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      - name: Verify lockfile up-to-date (incl. exclude-newer)
        # Fails if pyproject and uv.lock diverge — e.g. someone widened
        # [tool.uv] exclude-newer in pyproject without re-locking. gen_no_build
        # --check only validates the wheels-only list, not lock freshness.
        run: uv lock --check

      - name: Verify wheels-only allowlist in sync with uv.lock
        run: uv run python scripts/gen_no_build.py --check

      - name: Verify route artifacts in sync with routes.json
        run: uv run python scripts/gen_routes.py --check

      - name: Ruff check
        run: uv run ruff check .

      # `-n 2 --dist loadfile` because CLAUDE.md's claim that parallel is slower on
      # a 2-4 core runner was a PREDICTION, and review 2026-10-26 A1 measured the
      # opposite. Mind A1's scope before quoting its numbers: a 984-test SUBSET
      # (web + collab), pytest pinned to 2 cores, Postgres UNPINNED -- which A1 calls
      # optimistic -- giving 308 s serial -> 162 s at `-n 2`. `-n 2` on a real GitHub
      # runner is in A1's own "Not checked" list, so this flag is a measured-elsewhere
      # bet, not a measured-here fact. The first few real runs are the measurement.
      #
      # `--dist loadfile` keeps every file's tests on one worker, which the suite's
      # module-scoped testcontainers Postgres fixtures require; `--dist loadgroup`
      # scatters them. Never `-n auto`.
      #
      # `-v` is kept from the pre-split step on purpose. Not for naming failures --
      # pytest does that in the FAILURES summary either way -- but for the HANG case
      # pyproject.toml's `timeout` comment records from a live incident: "the run
      # showed no failing test id -- just a job that sat for 595 s". Under `-n 2`, `-v`
      # also attributes each test to its worker. The plan's verbatim command omitted
      # it; dropping it would have been an observability regression smuggled in by a
      # regrouping.
      - name: Pytest (with coverage)
        run: uv run pytest -v -n 2 --dist loadfile --cov --cov-report=json:coverage.json --cov-report=term:skip-covered

      # Lines and branches per package, held at coverage-floors.json. The table
      # also goes to the run's summary page, which is where the numbers are recorded.
      - name: Coverage floors (backend)
        run: uv run python scripts/check_coverage_floors.py --section backend --report coverage.json --report-only

      - name: Upload the backend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-backend
          path: coverage.json
          if-no-files-found: ignore

  # mypy over src/grant_lab with the [tool.mypy] settings in pyproject.toml. Its own
  # job, so the slow backend job does not get slower and a type error is reported
  # even when the tests fail.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      # --config-file is explicit: without it, a stray mypy.ini would be read
      # instead of pyproject.toml.
      - name: Type check (mypy)
        run: uv run mypy --config-file pyproject.toml

  # Supply-chain scanning over the Python lockfile. Its own job so an advisory
  # published overnight cannot skip a single frontend or packaging step.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      # ORDER: the export+scan pair runs BEFORE pip-audit on purpose. A step that
      # fails skips every later step in its job, so whichever advisory tool runs
      # first can hide the other's findings. pip-audit is the one carrying a
      # waiver, so it is the one more likely to redden on a schedule nobody chose
      # — putting it last makes this job's internal masking zero. (Same principle
      # as `pnpm audit --prod` being last in the `frontend` job.)
      # Why this export step exists: the OSV step below used to scan
      # `--lockfile=uv.lock` and could NEVER fail (review 2026-10-26 A1 F1).
      # osv-scanner 1.9.2 has no uv extractor, so it
      # exits 127 with "could not determine extractor for /ws/uv.lock", and the
      # action image's entrypoint (/root/exit_code_redirect.sh) rewrites 127 to
      # 0. The step reported success while scanning nothing — worse than no
      # step, because it reads as a passing gate. Scan a requirements.txt
      # projection of the SAME lockfile instead, which osv-scanner does have an
      # extractor for.
      #
      # The export is GENERATED here and never committed: a checked-in export
      # is a second lockfile that drifts from uv.lock silently. `--frozen`
      # makes it a pure projection of uv.lock. `uv lock --check` proves uv.lock
      # matches pyproject, but it now runs in the `backend` job CONCURRENTLY with
      # this one — not before it — so this scan can be a projection of a stale
      # lock while `backend` reports the staleness in parallel. Both verdicts
      # still appear on the same run, so nothing is hidden; just do not read this
      # step's green as "the lock was checked first". It is gitignored. THIS STEP AND THE SCAN BELOW ARE AN ATOMIC PAIR — the export
      # writes the file the scan reads, so they must stay in this job, in this
      # order (Task 4 review M4.3).
      - name: Export locked Python deps for OSV (uv.lock has no OSV extractor)
        run: uv export --frozen --no-hashes --format requirements-txt > requirements-osv.txt

      - name: OSV-Scanner (uv.lock)
        # google/osv-scanner-action ships no moving major tag; pin the latest v1.x release.
        #
        # Waivers live in osv-scanner.toml at the repo root — the same directory
        # as the export, which is where osv-scanner looks for its config — each
        # with an `ignoreUntil` that reddens this step once it lapses. Verified
        # by running this exact image on the export locally (2026-10-26, on the
        # since-removed certifi PYSEC-2026-4320 waiver): with the config removed
        # the scan exited 1; with it, 0; and with `ignoreUntil` backdated, 1 again.
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: "--lockfile=requirements.txt:requirements-osv.txt"

      - name: pip-audit (Python deps)
        # pip-audit is now a locked dev dependency (synced above), so we run it
        # from the synced env rather than an unpinned `--with` resolve.
        #
        # --ignore-vuln waivers, when one is needed: each must name the fixed
        # version and the date it can be dropped. pip-audit has no expiry
        # mechanism of its own, so a matching [[IgnoredVulns]] block in
        # osv-scanner.toml carries the `ignoreUntil` that actually reddens CI
        # when a waiver lapses — keep the two in sync. None is active: the last
        # one (PYSEC-2026-4320, certifi) was cleared on 2026-10-31 by upgrading
        # certifi, as its own instructions said to.
        run: uv run pip-audit

  # Frontend gates: lint, vitest, the typecheck + production build, the OpenAPI
  # drift check, and the pnpm/OSV scans over the JS lockfile.
  #
  # It needs BOTH toolchains, because scripts/gen_openapi_types.sh is a Python
  # generator with a Node consumer: it imports grant_lab to build the OpenAPI
  # schema (`uv run --python 3.12`) and then pipes it through
  # `pnpm exec openapi-typescript`. Its name says "frontend"; its dependencies say
  # both, and the generated artefact is a frontend file — so it lives here and the
  # Python setup comes with it.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version (matches frontend/.nvmrc
          # and the node:22 build container) — bump in one place.
          node-version-file: frontend/.nvmrc

      # --- Frontend SPA (Plan 2): pnpm frozen + scripts-off, gates, scanners ---
      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Frontend deps (frozen, scripts off)
        run: cd frontend && pnpm install --frozen-lockfile

      # Review 2026-09-02 A7 F5: there was NO frontend lint gate at all — no
      # eslint/oxlint/biome config anywhere, so five `eslint-disable` directives
      # in src/ suppressed rules that had never run. oxlint is zero-config and
      # one dev dep. `--deny-warnings` makes it a gate, not a report.
      - name: Frontend lint (oxlint)
        run: cd frontend && pnpm run lint

      - name: Frontend unit tests with coverage (vitest)
        run: cd frontend && pnpm run test:coverage

      # tsc over src/ (tests included) and the production `vite build`. vitest
      # does not typecheck, so without this step a type error would surface only
      # in the match-e2e and package jobs.
      - name: Frontend typecheck + production build
        run: cd frontend && pnpm run build

      # OpenAPI -> TS drift: regenerate the committed client types from the live
      # route definitions (DB-free; no server needed) and fail if they changed.
      # Keeps frontend/src/api/schema.gen.ts in lockstep with the FastAPI schema.
      - name: OpenAPI types in sync (drift check)
        run: |
          bash scripts/gen_openapi_types.sh
          git diff --exit-code frontend/src/api/schema.gen.ts

      - name: Coverage floors (frontend)
        run: uv run python scripts/check_coverage_floors.py --section frontend --report frontend/coverage/coverage-summary.json --report-only

      - name: Upload the frontend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-frontend
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: ignore

      # Block on PRODUCTION (runtime/browser) deps — these are what ship in the
      # SPA bundle. react/react-dom are currently clean.
      #
      # It is LAST among the blocking steps of this job on purpose: a step that
      # fails skips every later step, so the gates that test our own code all run
      # before any advisory feed can turn the job red (review 2026-10-26 M-ops-1).
      - name: pnpm audit (production deps — blocking)
        run: cd frontend && pnpm audit --prod --audit-level=high
      # Dev/build-tooling advisories (vite/esbuild/vitest dev-server, etc.) do
      # NOT reach production (FastAPI serves only static files — no node, vite,
      # or vitest at runtime) and are mitigated by the ephemeral secretless build
      # + never exposing dev servers (no `vitest --ui`). Surface them
      # (non-blocking); Dependabot (npm) drives the toolchain bumps.
      - name: pnpm audit (all deps — informational)
        run: cd frontend && pnpm audit || true

      # Informational, for the same reason as `pnpm audit (all deps)` directly
      # above — and it has to say so in its own exit code, not just in a
      # comment. Without continue-on-error this step exited 1 on 47 advisories
      # in 13 packages that are almost entirely dev/build tooling (vite x20,
      # vitest, esbuild, brace-expansion), flatly contradicting the comment two
      # steps up that calls dev advisories informational (review 2026-10-26 A1
      # F2). `pnpm audit --prod --audit-level=high` above is the blocking
      # production gate and is clean; this one surfaces the toolchain backlog
      # that Dependabot (npm) drives.
      #
      # It stays in THIS job rather than moving to `audit` so those two
      # back-references keep pointing at the steps they name, and because
      # continue-on-error already means it can hide nothing from anyone.
      #
      # The one dev-tooling advisory class that WOULD reach production is the
      # Vite dev server (arbitrary file read via crafted request). It is
      # reachable only while a Vite dev server is actually running and exposed,
      # which happens only under SPA_MODE=dev. Production runs SPA_MODE=prod,
      # where FastAPI serves the pre-built bundle from src/grant_lab/web/spa/
      # and no Vite process exists at all. So: never set SPA_MODE=dev on a host
      # reachable from outside the hospital network — that, not this step, is
      # what keeps the vite advisories out of scope.
      - name: OSV-Scanner (pnpm-lock.yaml)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: "--lockfile=frontend/pnpm-lock.yaml"

      # LAST in the job on purpose: once the floors are enforced, a coverage dip
      # fails this step, and a failed step skips every later one. Nothing may sit
      # after it except its own upload.
  # The shippable artefact: the container SPA build, the packaging step, and the
  # wheel. No `needs:` — it builds the SPA inside frontend/Dockerfile with its own
  # pnpm install, so there is nothing to share and nothing to wait for.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      # Build the SPA in the ephemeral, non-root, secretless container — then
      # extract ONLY the static bundle and package it into the wheel. The wheel
      # MUST contain spa/index.html (a missing-build wheel fails here, not at
      # runtime). NOTE: Socket CLI (spec §5) is a token-gated follow-up — it
      # needs SOCKET_SECURITY_API_KEY; pnpm audit + OSV over the lockfile +
      # Dependabot (npm) provide the tokenless JS supply-chain baseline.
      - name: Build SPA in the ephemeral secretless container
        run: docker build -f frontend/Dockerfile -t grant-lab-spa-build .

      # Extract to frontend/dist and let scripts/package_spa.sh write the served
      # tree. It is the ONLY writer of src/grant_lab/web/spa (pinned by
      # tests/architecture/test_package_spa.py); a `docker cp` straight into that
      # directory would be a second one.
      - name: Extract the SPA bundle and package it through the gate
        run: |
          c=$(docker create grant-lab-spa-build)
          rm -rf frontend/dist && mkdir -p frontend/dist
          docker cp "$c:/build/dist/." frontend/dist/
          docker rm "$c"
          bash scripts/package_spa.sh

      - name: Build the wheel and assert it contains the SPA
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -q "grant_lab/web/spa/index.html"

  # Playwright against the REAL backend: frontend/e2e/smoke.spec.ts (a11y at /,
  # FastAPI's JSON 404 for an unknown path, sign-out ending the session, a call
  # page opened from the feed and reloaded). Both front doors are gated: `dev` is
  # the Vite proxy, `prod` builds the SPA, packages it through
  # scripts/package_spa.sh and serves it from uvicorn under the strict CSP.
  # match.spec.ts (`match-e2e` below) mocks the API in-page, so this job is the
  # only browser check that reaches FastAPI. Its own job so a browser-level
  # failure is reported on its own and the unit gates keep running.
  e2e:
    # Pinned, not ubuntu-latest: GitHub moved ubuntu-latest to 26.04 and Playwright
    # 1.60 refuses to install Chromium there ("does not support chromium on
    # ubuntu26.04-x64", CI run 40789842634). Unpin when Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        spa_mode: [dev, prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (frozen)
        run: uv sync --all-extras --frozen

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Frontend deps (frozen, scripts off)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Playwright Chromium (+ OS libs)
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      # The harness boots a testcontainers Postgres (Docker is on the runner),
      # migrates, seeds a password user, that user's default profile and one open
      # call (scripts/e2e_seed.py), starts uvicorn (and Vite in dev mode), runs the
      # smoke spec, and tears it all down.
      - name: Playwright smoke (real backend) — SPA_MODE=${{ matrix.spa_mode }}
        env:
          E2E_SPA_MODE: ${{ matrix.spa_mode }}
          E2E_SPECS: e2e/smoke.spec.ts
        run: bash scripts/e2e_run.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.spa_mode }}
          path: |
            frontend/test-results/
            .e2e-vite.log
          if-no-files-found: ignore

  # The production bundle in a real browser with the API mocked in-page
  # (e2e/match.spec.ts). Its own job, and deliberately not a third value in the
  # `e2e` matrix above: that matrix drives scripts/e2e_run.sh, which needs uv, a
  # testcontainers Postgres and a seeded user. This needs none of them —
  # playwright.config.ts's match mode builds the bundle, serves frontend/dist
  # statically and mocks /api in-page. ~2 min, no Docker, no Python.
  #
  # Why it exists: release 1 shipped with no way to sign out and a call list
  # whose rows navigated nowhere — obvious in a browser, invisible to unit tests.
  match-e2e:
    # Pinned, not ubuntu-latest: GitHub moved ubuntu-latest to 26.04 and Playwright
    # 1.60 refuses to install Chromium there ("does not support chromium on
    # ubuntu26.04-x64", CI run 40789842634). Unpin when Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Enable corepack (pnpm pinned via package.json packageManager)
        run: corepack enable

      - name: Frontend deps (frozen, scripts off)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Playwright Chromium (+ OS libs)
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      # `pnpm run e2e:match` is E2E_MODE=match; the webServer chains `pnpm run
      # build && serve`, so a build that fails at tsc cannot leave the previous
      # dist/ standing for the browser to pass over.
      - name: Browser smoke (production bundle, mocked API)
        run: cd frontend && pnpm run e2e:match

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-match
          path: frontend/test-results/
          if-no-files-found: ignore
