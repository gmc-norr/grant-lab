# Fail a PR that introduces a dependency with a known vulnerability, before it
# can be merged (supply-chain baseline, spec §5 — detection at the PR boundary).
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA-pinned third-party actions (see ci.yml); Dependabot bumps the pins.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Dependency Review
        # actions/dependency-review-action ships no moving major tag; pin the latest v4.x release.
        uses: actions/dependency-review-action@bc41886e18ea39df68b1b1245f4184881938e050 # v4.7.2
        with:
          fail-on-severity: high
