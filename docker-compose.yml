# Project name is PINNED. Compose otherwise derives it from the directory, so
# renaming this folder would silently create a new, EMPTY database volume and
# orphan the real one. The volume below is likewise pinned to its existing name.
name: grant-lab

services:
  db:
    # pgvector/pgvector:pg16 = Postgres 16 with the `vector` extension
    # preinstalled. Migration 0007 (pgvector + embedding columns) requires
    # it; vanilla `postgres:16` will fail at `CREATE EXTENSION vector`.
    # Matches the image used by tests/conftest.py so dev and CI agree.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: call_manager
      POSTGRES_PASSWORD: call_manager
      POSTGRES_DB: call_manager
    ports:
      # Bind to loopback so a known-credential dev DB is never exposed to
      # the LAN. Override the host port via HOST_DB_PORT if 5432 is busy
      # (e.g. another local Postgres):  HOST_DB_PORT=5433 docker compose up -d
      - "127.0.0.1:${HOST_DB_PORT:-5432}:5432"
    volumes:
      - call_manager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U call_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  call_manager_pgdata:
    # Keeps the pre-rename volume, which holds the dev data (58 calls, 11
    # workspaces at the 2026-09-05 rename). Compose warns that this volume
    # was created for project "call-monitor"; that warning is cosmetic and it
    # attaches correctly. Do NOT silence it with `external: true` — that makes
    # a fresh clone fail instead of creating the volume.
    name: call-monitor_call_manager_pgdata
