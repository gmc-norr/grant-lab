{% extends "base.html" %}

{% block title %}Review metadata — {{ ref.filename|e }}{% endblock %}

{% block content %}
<a href="/workspaces/{{ workspace.id }}/references" class="backlink">&larr; Back to references</a>
<hgroup>
  <h1>Review metadata — {{ ref.filename|e }}</h1>
  <p>Status: <span class="status status-pending">{{ ref.metadata_status }}</span></p>
</hgroup>

<form method="post"
      action="/workspaces/{{ workspace.id }}/references/{{ ref.id }}/metadata">
  <label>
    Title
    <input type="text" name="title" value="{{ title }}">
  </label>

  <label>
    Authors (one per line — "Family, Given" or free text)
    <textarea name="authors" rows="5">{{ authors_text }}</textarea>
  </label>

  <label>
    Year
    <input type="text" name="year" value="{{ year }}" class="input-short">
  </label>

  <label>
    Venue (journal / conference)
    <input type="text" name="venue" value="{{ venue }}">
  </label>

  <label>
    DOI
    <input type="text" name="doi" value="{{ doi }}">
  </label>

  <button type="submit">Approve metadata</button>
</form>
{% endblock %}
