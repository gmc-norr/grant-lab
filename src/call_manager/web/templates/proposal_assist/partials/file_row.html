{# Single attachment row — used by the panel list AND as the HTMX swap-in
   response from POST /workspaces/<id>/files. The context provides `att`
   (Attachment), `workspace` (Workspace), and `is_owner` (bool). #}
<div class="file-row" data-attachment-id="{{ att.id }}">
  <img src="/workspaces/{{ att.workspace_id }}/files/{{ att.id }}"
       alt="{{ att.filename }}">
  <span class="filename">{{ att.filename }}</span>
  <span class="uploaded">
    {{ att.uploaded_at | display_dt }}
  </span>
  {% if is_owner %}
  <form method="post"
        action="/workspaces/{{ att.workspace_id }}/files/{{ att.id }}/delete"
        hx-post="/workspaces/{{ att.workspace_id }}/files/{{ att.id }}/delete"
        hx-target="closest .file-row"
        hx-swap="outerHTML"
        hx-confirm="Delete this file? This cannot be undone.">
    <button type="submit" class="secondary outline compact">Delete</button>
  </form>
  {% endif %}
</div>
